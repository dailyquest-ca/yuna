name: monthly-funnel
on:
  schedule:
    - cron: '0 10 * * 6'   # weekly Sat 10:00 UTC; in-job guard keeps real runs to the 1st Saturday
  workflow_dispatch:
    inputs:
      force:
        description: 'run census regardless of date'
        default: 'false'
jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*"
      - run: set -o pipefail; python src/funnel.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py monthly-funnel /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
