name: monthly-funnel
on:
  schedule:
    - cron: '0 10 * * 6'   # weekly Sat 10:00 UTC; in-job guard keeps real runs to the 1st Saturday
  workflow_dispatch:
    inputs:
      force:
        description: 'run census regardless of date'
        default: 'false'
jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*"
      - name: stage 1 — L0 census
        run: set -o pipefail; python src/funnel.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
      # STALE_ONLY skips names that have filed nothing since their last pull; a name with no
      # fundamentals row at all is never skipped, so the cold start still sweeps everything once.
      - name: stage 1.5 — fundamentals sweep
        run: set -o pipefail; python src/fundamentals.py 2>&1 | tee -a /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          # force=true means "rebuild from scratch": census regardless of date, full re-sweep
          STALE_ONLY: ${{ inputs.force == 'true' && 'false' || 'true' }}
          WORKERS: '10'
      - name: stage 2 — C1, CCN, hurdle, bench
        run: set -o pipefail; python src/score.py 2>&1 | tee -a /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py monthly-funnel /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
