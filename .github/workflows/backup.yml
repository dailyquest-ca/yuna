name: backup
on:
  schedule:
    - cron: '23 14 * * 6'  # every Sat 14:23 UTC; the job backs up if the month has none, else exits
                           # :23 not :00 — GitHub names the top of the hour a high-load window for
                           # `schedule` and drops queued jobs under load (see ingest-daily.yml)
  workflow_dispatch:
    inputs:
      force:
        description: 'back up regardless of date'
        default: 'false'
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # The guard moved INTO the job (§4.2, ruled 2026-08-05): monthly work is guarded by whether
      # it has run, never by the date. As a shell step it ran before the heartbeat opened, so a
      # firing outside the first seven days left no trace at all — the same shape that hid
      # `ingest-universe`'s absence for a month.
      - name: dump
        run: set -o pipefail; python src/backup.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE: ${{ inputs.force || 'false' }}
      - name: commit
        run: |
          git config user.name  "yuna-backup[bot]"
          git config user.email "yuna-backup@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: $(date -u +%Y-%m-%d) (bars excluded)"
          git push
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py backup /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
