name: ingest-filings
# **RETIRED FROM THE SCHEDULE by §6.3 (2026-08-16). Dispatch only.**
#
# §4.5: "No fundamentals, news, intraday, or calendar feeds are read by any decision." v1.0's
# engine is §3.3's one number, and §3.3 says the rank is the entire opinion — so nothing this job
# writes reaches a decision any more. Its cron is removed rather than the job, because §4.5 also
# names the product this system downgrades to once the legacy jobs are retired (EOD Historical
# Data — All World), and a weekly fundamentals sweep against a plan that no longer carries the
# endpoint would fail every Saturday for a feed nobody reads.
#
# Everything below this line describes the retired behaviour and is kept for the dispatch path.
#
# §4.2, verb one, filings slice: new filings -> fundamentals fields re-extracted -> effective
# shares frozen (§3.1). Runs with the weekly sweep and on filing detection.
#
# STALE_ONLY skips names that have filed nothing since their last pull; a name with no
# fundamentals row at all is never skipped, so a cold start still sweeps everything once. On top of
# the staleness pass it fills up to `fundamentals_missing_cap` names that hold no row at all (the
# standing backlog — 298 of them on 2026-08-07) and any row whose filing document was never stored,
# then meters itself out at `api_quota_ceiling` of the daily budget (§4.1).
#
# **Ordering, once:** §3.0's foreign-statement conversion reads FX bars, and `ingest-daily` is what
# registers and backfills those pairs (§4.2 gives it the FX feed). So the first sweep after a new
# statement currency appears must run *after* a nightly, or those names stay on the data-confidence
# path — the job says so on its heartbeat rather than converting with rates it does not have.
#
# `reextract: true` re-derives every stored row from the filing documents already in the database,
# with zero vendor calls — which is how a law change to the extraction (the FX restatement, SBC net
# of FCF) re-prices the whole archive instead of buying the same facts twice.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'fetch but write nothing'
        default: 'false'
      full_sweep:
        description: 'ignore the stale filter and re-pull every name'
        default: 'false'
      reextract:
        description: 're-derive every row from stored filings; no vendor calls at all'
        default: 'false'
      tickers:
        description: 'comma-separated names to sweep instead of the universe'
        default: ''

# §4.2, added 2026-08-03: every job that writes shares ONE concurrency group, so Actions serialises
# them. `ingest-daily` and `backfill` overlapped once and deadlocked on the prices index — Postgres
# caught it and killed a transaction, which is the good outcome, but two writers on one table is a
# race the schedule should make impossible rather than one the database has to survive.
concurrency:
  group: yuna-writes
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python src/fundamentals.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REEXTRACT: ${{ inputs.reextract || 'false' }}
          TICKERS: ${{ inputs.tickers || '' }}
          STALE_ONLY: ${{ inputs.full_sweep == 'true' && 'false' || 'true' }}
          WORKERS: '10'
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py ingest-filings /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
