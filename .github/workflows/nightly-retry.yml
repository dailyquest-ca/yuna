name: nightly-retry
on:
  schedule:
    - cron: '0 3 * * 2-6'   # one hour after the primary; skips itself if primary went green
  workflow_dispatch: {}
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: retry ingest
        run: set -o pipefail; python src/ingest.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          JOB_NAME: nightly-retry
          DRY_RUN: 'false'
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py nightly-retry /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
