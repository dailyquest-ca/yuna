name: nightly-ingest
on:
  schedule:
    - cron: '0 2 * * 2-6'   # 02:00 UTC Tue-Sat = Mon-Fri evenings PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'fetch but write nothing to prices'
        default: 'false'
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*"
      - name: ingest
        run: python src/ingest.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
