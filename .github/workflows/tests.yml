name: tests
# The formula tests need no database and no vendor key, so they run on every push and every PR.
# A red suite here means a number that sizes real money changed without anyone deciding to.
on:
  push:
  pull_request:
  workflow_dispatch: {}
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
      - name: compile every job
        run: python -m compileall -q src/
