name: ingest-universe
# §4.2, verb one, monthly slice: rebuild L0 from listings and the liquidity filters. Membership
# only — the C1/CCN half of the old funnel is just `score` running afterwards, which the schedule
# already provides (Sat 12:00).
on:
  # PAUSED 2026-08-03 — the database is down on a full disk (see
  # docs/incident-2026-08-03.md). Every job here writes to it, so the whole
  # schedule is commented out rather than left to fail nightly. Restore the
  # block below verbatim once the disk is resized and the pipeline is green.
  # schedule:
  #   - cron: '0 10 * * 6'   # weekly Sat 10:00 UTC; in-job guard keeps real runs to the 1st Saturday
  workflow_dispatch:
    inputs:
      force:
        description: 'run census regardless of date'
        default: 'false'

# §4.2, added 2026-08-03: every job that writes shares ONE concurrency group, so Actions serialises
# them. `ingest-daily` and `backfill` overlapped once and deadlocked on the prices index — Postgres
# caught it and killed a transaction, which is the good outcome, but two writers on one table is a
# race the schedule should make impossible rather than one the database has to survive.
concurrency:
  group: yuna-writes
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: L0 census
        run: set -o pipefail; python src/funnel.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py ingest-universe /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
