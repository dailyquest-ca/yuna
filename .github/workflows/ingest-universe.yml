name: ingest-universe
# Verb one, monthly slice: rebuild membership from the exchange listing and the bulk tape (§3.2's
# universe, §4.5's data). Membership only — `pipeline.yml` chains the Saturday letter off this
# job by `workflow_run`, so the chain fires on a red census too; §5.6 (2026-09-13) rules that a
# census red warns and never holds buys.
#
# Fires WEEKLY and rebuilds only when the month's universe is unbuilt (§4.2, ruled 2026-08-05:
# monthly work is guarded by whether it has run, never by the date). Cron cannot express "first
# Saturday" — dom and dow are OR-ed — and the date-keyed guard this replaces skipped the month in
# silence whenever its one firing was missed. It had never produced a single runs row.
on:
  schedule:
    - cron: '23 10 * * 6'  # Sat 10:23 UTC — rebuilds if the month's universe is unbuilt, else exits
                           # :23 not :00 — GitHub names the top of the hour a high-load window for
                           # `schedule` and drops queued jobs under load (see ingest-daily.yml)
  workflow_dispatch:
    inputs:
      force:
        description: 'rebuild even if this month is already built'
        default: 'false'

# §4.2, added 2026-08-03: every job that writes shares ONE concurrency group, so Actions serialises
# them. `ingest-daily` and `backfill` overlapped once and deadlocked on the prices index — Postgres
# caught it and killed a transaction, which is the good outcome, but two writers on one table is a
# race the schedule should make impossible rather than one the database has to survive.
concurrency:
  group: yuna-writes
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: L0 census
        run: set -o pipefail; python src/funnel.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FORCE: ${{ inputs.force || 'false' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py ingest-universe /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
