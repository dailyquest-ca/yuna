name: backtest
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'run label'
        default: 'momentum v1'
      start_nav:
        description: 'starting NAV in CAD'
        default: '200754.38'
      vol_mode:
        description: 'fill_then_exit (plan §5.1) | confirm_first'
        default: 'fill_then_exit'
      breakeven_step:
        description: 'pyramid step at which the stop moves to breakeven (§3.2 = 3)'
        default: '3'
      mcn_exit:
        description: 'MCN below which a position exits (§3.3 = 55)'
        default: '55'
      min_hold_days:
        description: 'minimum intended hold; stops always exempt (§1 = one week)'
        default: '0'
      dry_run:
        description: 'simulate, write nothing'
        default: 'false'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python src/backtest.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LABEL: ${{ inputs.label || 'momentum v1' }}
          START_NAV: ${{ inputs.start_nav || '200754.38' }}
          VOL_MODE: ${{ inputs.vol_mode || 'fill_then_exit' }}
          BREAKEVEN_STEP: ${{ inputs.breakeven_step || '3' }}
          MCN_EXIT: ${{ inputs.mcn_exit || '55' }}
          MIN_HOLD_DAYS: ${{ inputs.min_hold_days || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py backtest /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
