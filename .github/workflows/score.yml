name: score
# §4.2, verb two: the ONE writer of every derived number. Gate C1 -> CCN -> hurdles -> market gate
# -> group RS -> L1-M -> MCN -> queue -> triggers -> stops and trails -> the book revalued -> NAV
# -> arming. A pure function of the database: it makes no vendor call at all.
#
# Runs after every ingest. The Saturday 12:00 appointment is this job in its weekly slot, not a
# different job — that is where the full weekly rank lands.
on:
  # PAUSED 2026-08-03 — the database is down on a full disk (see
  # docs/incident-2026-08-03.md). Every job here writes to it, so the whole
  # schedule is commented out rather than left to fail nightly. Restore the
  # block below verbatim once the disk is resized and the pipeline is green.
  # schedule:
  #   - cron: '30 3 * * 2-6'  # after ingest-daily's two windows
  #   - cron: '0 12 * * 6'    # Sat 12:00 UTC — the full weekly rank
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'compute everything, write nothing'
        default: 'false'
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python src/score.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SCHEDULED_UTC: ${{ github.event.schedule == '0 12 * * 6' && '12:00' || '03:30' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py score /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
