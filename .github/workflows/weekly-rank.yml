name: weekly-rank
on:
  schedule:
    - cron: '0 12 * * 6'   # Sat 12:00 UTC — after funnel on 1st Saturdays, per plan
  workflow_dispatch: {}
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*" numpy
      - run: python src/rank.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
