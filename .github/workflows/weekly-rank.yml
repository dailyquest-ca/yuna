name: weekly-rank
on:
  schedule:
    - cron: '0 12 * * 6'   # Sat 12:00 UTC — after funnel on 1st Saturdays, per plan
  workflow_dispatch: {}
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]==3.2.*" numpy
      - run: set -o pipefail; python src/rank.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py weekly-rank /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
