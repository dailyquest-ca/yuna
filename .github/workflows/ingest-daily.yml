name: ingest-daily
# §4.2, verb one: write the world down. Bars, FX, corporate actions, the earnings calendar and
# the quarantine — source-of-truth tables only. Everything derived from these rows belongs to
# `score`, which runs next.
#
# FX is the whole of §4.1's row, not just USDCAD: every statement currency a foreign filer reports
# in gets a pair registered here and backfilled by the per-ticker pass, because §3.0 converts
# financials at fiscal-period-end rates and cannot do it with rates we never pulled.
#
# The earnings calendar runs twice — the broad file, and then a per-name refresh of everything the
# arming stage is about to reach for. The broad file is not complete: Arcosa's 2026-08-05 report
# was missing from it, so the blackout wall showed nothing and the nightly armed straight through
# the print, twice (obs 114).
#
# Scheduled TWICE on purpose. §4.2: "the second run reads the runs table and exits if the night
# is already green". That is the retry, and it is the same job with the same name rather than a
# separate one, so `runs` reads as one job with two appointments.
#
# **Both firings sit at :23, not on the hour** (2026-08-28). GitHub documents the top of every hour
# as a high-load window for the `schedule` event, and says queued jobs may be *dropped* outright
# when the load is high enough. At `0 2` this job was never once on time: fourteen consecutive
# scheduled runs drifted 50-130 minutes, median 62. Then two nights running the queue swallowed
# it whole — 621 minutes on 2026-08-27, and 707 on 2026-08-28, that one arriving at 13:46 UTC,
# most of a day after the morning it was written for and hours after the miss had been repaired
# by hand. 2026-08-27's close sat missing from `prices` for a day in the meantime. Neither
# firing was dropped in the end; a run that late is simply not a run you have when you need it.
# Moving off :00 buys nothing but a shorter queue, which is the only lever
# this repo has: GitHub's guidance is to "schedule your workflow to run at a different time of the
# hour", and it reduces the chance of a drop rather than removing it. The quarter-hours are the
# next most contended slots, so :23 avoids those too.
#
# **And the firings sit in the evening, not the small hours** (2026-09-02). Moving off :00 did not
# shorten the queue: the next four scheduled runs drifted 325–413 minutes. What a 02:23 slot never
# had was ROOM — twelve hours of drift put the brief after the 13:30 UTC open, twice. The vendor
# documents NYSE and NASDAQ as updated within fifteen minutes of the close, so the tape is on the
# shelf by about 20:15 UTC; firing at 22:23 leaves fifteen hours for the queue to do its worst.
# The cost is a new failure mode, and it is guarded: a firing that beats the vendor's bulk file
# would land YESTERDAY's tape and go green, and the retry would then exit on "already green" —
# a silent stale day. So a scheduled run whose newest tape is not newer than the store's
# `data_date` writes nothing and records `awaiting_vendor`; the retry ignores that row and fetches
# again, and if it finds the same it fails red, because a night with no tape has to have a reader
# (`ingest.py`). The repair is the `date` input below. A hand dispatch is never guarded: pressing
# the button means fetch.
#
# The retry stays 60 minutes behind the first firing, and it identifies itself by matching
# `github.event.schedule` against its own cron string — so the retry's cron is written three
# times below (the schedule, `SKIP_IF_GREEN`, `SCHEDULED_UTC`) and the clock twice more.
# **Change one and you must change them all**, or the second firing stops recognising itself
# as the retry and re-ingests the night instead of exiting.
on:
  schedule:
    - cron: '23 22 * * 1-5'  # 22:23 UTC Mon-Fri = the same evening ET, ~2h after the close
    - cron: '23 23 * * 1-5'  # one hour later; exits if 22:23 went green on a fresh tape
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'fetch but write nothing'
        default: 'false'
      date:
        description: 'ingest ONE named tape date, YYYY-MM-DD, instead of the newest — closes a missed session (learning 59). Blank = newest.'
        default: ''

# §4.2, added 2026-08-03: every job that writes shares ONE concurrency group, so Actions serialises
# them. `ingest-daily` and `backfill` overlapped once and deadlocked on the prices index — Postgres
# caught it and killed a transaction, which is the good outcome, but two writers on one table is a
# race the schedule should make impossible rather than one the database has to survive.
concurrency:
  group: yuna-writes
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: ingest the day
        run: set -o pipefail; python src/ingest.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # dispatch-only (learning 59): the schedule never sets it, so blank on every cron firing
          INGEST_DATE: ${{ inputs.date }}
          # the 23:23 firing is the retry: same job, same row shape, exits if the night is green
          SKIP_IF_GREEN: ${{ github.event.schedule == '23 23 * * 1-5' && 'true' || 'false' }}
          SCHEDULED_UTC: ${{ github.event.schedule == '23 23 * * 1-5' && '23:23' || '22:23' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py ingest-daily /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
