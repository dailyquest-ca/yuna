name: ingest-daily
# §4.2, verb one: write the world down. Bars, FX, corporate actions, the earnings calendar and
# the quarantine — source-of-truth tables only. Everything derived from these rows belongs to
# `score`, which runs next.
#
# Scheduled TWICE on purpose. §4.2: "the second run reads the runs table and exits if the night
# is already green". That is the retry, and it is the same job with the same name rather than a
# separate one, so `runs` reads as one job with two appointments.
on:
  # PAUSED 2026-08-03 — the database is down on a full disk (see
  # docs/incident-2026-08-03.md). Every job here writes to it, so the whole
  # schedule is commented out rather than left to fail nightly. Restore the
  # block below verbatim once the disk is resized and the pipeline is green.
  # schedule:
  #   - cron: '0 2 * * 2-6'   # 02:00 UTC Tue-Sat = Mon-Fri evenings PT
  #   - cron: '0 3 * * 2-6'   # one hour later; exits immediately if 02:00 went green
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'fetch but write nothing'
        default: 'false'
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: ingest the day
        run: set -o pipefail; python src/ingest.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # the 03:00 firing is the retry: same job, same row shape, exits if the night is green
          SKIP_IF_GREEN: ${{ github.event.schedule == '0 3 * * 2-6' && 'true' || 'false' }}
          SCHEDULED_UTC: ${{ github.event.schedule == '0 3 * * 2-6' && '03:00' || '02:00' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py ingest-daily /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
