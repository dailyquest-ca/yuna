name: fundamentals
# Dispatch-only tooling, deliberately unscheduled. §4.2 fixes the cadence at five scheduled jobs
# and says nothing joins the schedule without a plan edit; the staleness sweep already runs as
# stage 1.5 of monthly-funnel, and filing-triggered re-pulls belong in the nightly (roadmap J).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'comma-separated tickers (blank = the whole L0 + holdings)'
        default: ''
      reextract:
        description: 'true = re-derive every row from stored raw_doc; zero vendor calls'
        default: 'false'
      stale_only:
        description: 'only names whose earnings date passed since their last pull'
        default: 'false'
      workers:
        description: 'concurrent fetches'
        default: '8'
      sweep_limit:
        description: 'cap the sweep to the top N names by market cap (0 = all)'
        default: '0'
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: sweep
        run: set -o pipefail; python src/fundamentals.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TICKERS: ${{ inputs.tickers }}
          STALE_ONLY: ${{ inputs.stale_only || 'false' }}
          REEXTRACT: ${{ inputs.reextract || 'false' }}
          WORKERS: ${{ inputs.workers || '8' }}
          SWEEP_LIMIT: ${{ inputs.sweep_limit || '0' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py fundamentals /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
