name: study
# The push study (WO-A3 §2). Dispatch-only tooling: walks every episode on the census with the
# capture audit's own definition, writes the ledger to `push_study` with the candidate gates and
# the exit autopsy, and joins nothing without a plan edit. Gates are then measured with SQL —
# a gate that shows no lift dies at the cost of zero trials.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'window start (blank = 2017-09-01, the E-series record)'
        default: ''
      end_date:
        description: 'window end (blank = the last bar)'
        default: ''
      dry_run:
        description: 'walk and count, write nothing'
        default: 'false'

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: run
        id: engine
        run: set -o pipefail; python src/push_study.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      - name: autopsy on failure
        if: failure() && steps.engine.outcome == 'failure'
        run: python src/report_fail.py push_study /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
