name: notify
# §4.2, verb four, second half: deliver what compose wrote — and prove there is something to
# deliver. push_channel (config) rules the mechanics; under 'cowork' the scheduled Routines in
# the Yuna chat/cowork project are the doorbell and this job is the pipeline-side receipt: a
# composed brief missing when the doorbell is about to ring is a RED tonight, not a surprise
# tomorrow (§4.7 — a missing message is itself the alarm).
#
# Writes nothing but its own runs row, so it takes no writes-group slot.
on:
  schedule:
    - cron: '20 4 * * 2-6'  # after compose at 04:05, before the R2 delivery Routine at 04:30
    - cron: '15 13 * * 6'   # after Saturday compose at 13:00, before the R3 Routine at 16:00
  workflow_dispatch:
    inputs:
      slot:
        description: 'nightly | saturday'
        default: 'nightly'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python src/notify.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUSH_WEBHOOK_URL: ${{ secrets.PUSH_WEBHOOK_URL }}
          NOTIFY_SLOT: ${{ inputs.slot || (github.event.schedule == '15 13 * * 6' && 'saturday' || 'nightly') }}
          SCHEDULED_UTC: ${{ github.event.schedule == '15 13 * * 6' && '13:15' || '04:20' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py notify /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
