name: compose
# §4.2, verb four, first half: the pipeline writes the words down. Runs after check, before
# notify — dispatch is a sequence: score → check → compose → notify. Reads v_session_payload
# (the same single read every session makes) and renders it mechanically. Deliberately keyless
# (ruled 2026-08-05): the §5.0 voice layer is applied by the scheduled project sessions, which
# run on Zak's Claude plan — never by a metered API key in this job.
#
# Nightly writes the stop sheet AND the next morning's brief: nothing touches the database
# between tonight's check and the open, so tomorrow's words composed tonight are the same words,
# earlier — waiting in `briefs` for the morning chat's one read (§5.1).
#
# Clock reasoning (§4.2 convention — UTC cron, ET market, PT for Zak): 04:05 UTC sits after
# check's 03:50 in both DST regimes; the R2 delivery Routine reads at 04:30 (~8:30–9:30 PM PT
# across regimes). Saturday's 13:00 UTC sits after the weekly check at 12:30; the R3 delivery
# Routine reads at 16:00.
on:
  schedule:
    - cron: '5 4 * * 2-6'   # after the nightly check at 03:50
    - cron: '0 13 * * 6'    # after the Saturday weekly check at 12:30
  workflow_dispatch:
    inputs:
      slot:
        description: 'nightly | saturday'
        default: 'nightly'
      dry_run:
        description: 'compute everything, write nothing'
        default: 'false'

concurrency:
  group: yuna-writes
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: set -o pipefail; python src/compose.py 2>&1 | tee /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          COMPOSE_SLOT: ${{ inputs.slot || (github.event.schedule == '0 13 * * 6' && 'saturday' || 'nightly') }}
          SCHEDULED_UTC: ${{ github.event.schedule == '0 13 * * 6' && '13:00' || '04:05' }}
      - name: autopsy on failure
        if: failure()
        run: python src/report_fail.py compose /tmp/job.out
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
