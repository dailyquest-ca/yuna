name: migrate
on:
  workflow_dispatch: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - name: apply migrations
        run: python -m yuna.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
