name: migrate
on:
  workflow_dispatch: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: apply migrations
        run: python src/migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
